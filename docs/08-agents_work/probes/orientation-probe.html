<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Orientation probe</title>

<!--
  THROWAWAY PROBE — design-lead, 10 August.
  Question design-H never answered: what does the board do with a
  LANDSCAPE photograph? 24 of the 46 real photographs are landscape.
  design-H's eight hand-placed table objects are 7 portrait + 1 landscape,
  and the one landscape (p3) carries a `land:true` flag that is read
  nowhere in the file.

  Every rule of design-H is kept here verbatim: paper is rotated,
  instruments are 0deg, and NOTHING translucent is ever laid on a
  photograph. The CSS below is copied from design-H, not re-derived.

  ?p=a  the frame crops to portrait      (option A)
  ?p=b  the object takes the photo shape (option B)
  ?p=d  a second object type: the plate  (option D)
  ?p=deck  the deck card, A vs landscape-native
  ?p=book  the book leaf, portrait in a landscape mount
-->

<style>
:root{
  --wood:url("https://d8j0ntlcm91z4.cloudfront.net/user_3GsJ2DSZxGcIbdUGLeK8PnRpye2/hf_20260809_114925_187e2b68-0ab4-488c-99a2-2930c98ccf13.png");
  --cork:url("https://d8j0ntlcm91z4.cloudfront.net/user_3GsJ2DSZxGcIbdUGLeK8PnRpye2/hf_20260809_114925_76b2ed1d-ed1b-4762-9a3a-ef73bf20985b.png");
  --paper:#f2ecdf; --bone:#efe7d6; --print:#fcf8ef; --verso:#e7dcc1;
  --edge:#d8ccb1; --kraft:#a98a63; --ink:#1a1611; --ink-2:#6b6053;
  --hand-eva:#7a2a1c; --hand-adam:#2f3a52; --accent:#2c5a37; --instrument:#f8f3e8;
  --amber:#d9a441; --cream:#e8dfc8;
  --hand-face:"Bradley Hand","Noteworthy","Marker Felt","Segoe Script",cursive;
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
  --lie: 0 1px 1px rgba(0,0,0,.34), 0 7px 12px rgba(0,0,0,.40), 0 20px 34px rgba(0,0,0,.26);
}
@font-face{ font-family:"Fraunces"; src:url("/fonts/fraunces-vf.woff2") format("woff2-variations");
  font-weight:400 600; font-display:swap; }

*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;background:#241811;}
body{ font-family:Georgia,"Times New Roman",serif; color:var(--ink); -webkit-font-smoothing:antialiased; }

#device{ position:relative; width:100%; height:100dvh; overflow:hidden; }
#viewport{ position:absolute; inset:0; overflow:hidden; }
#viewport::before{ content:""; position:absolute; inset:-10%; z-index:0;
  background:#241811 var(--wood) center/cover no-repeat; opacity:.6; }
#surface{ position:absolute; top:0; left:0; z-index:1; width:950px; height:2860px;
  transform-origin:0 0; background:#2a1c12 var(--wood) center/cover no-repeat;
  transform:translate(-40px,0); }

/* ── design-H object rules, copied verbatim ───────────────────── */
.obj{ position:absolute; z-index:10; }
.bare img,.print img{ display:block; width:100%; height:auto; background:#3a3129; }
.bare{ border-radius:2px; box-shadow:var(--lie); }
.bare img{ border-radius:2px; }
.print{
  background:linear-gradient(168deg,#fdfaf2,#f7f1e3 62%,#f1e9d8),
             url("/materials/paper-coldpress-stock.webp") center/210% auto;
  background-blend-mode:multiply;
  padding:9px 9px 0; border-radius:2px; box-shadow:var(--lie);
}
.print .chin{ display:block; font-family:var(--hand-face); font-size:15px;
  line-height:33px; height:33px; color:var(--hand-eva); text-align:center; }
.print .chin.his{ color:var(--hand-adam); }
.scrap{ filter:drop-shadow(0 2px 2px rgba(0,0,0,.30)) drop-shadow(0 9px 13px rgba(0,0,0,.42)); }
.scrap .sheet{ background:var(--bone) url("/materials/paper-bone-laid.webp") center/180% auto;
  padding:12px 14px 18px; box-shadow:inset 0 1px 0 rgba(255,255,255,.5); }
.torn-b{ clip-path:polygon(0 0,100% 0,100% 84%,96.2% 95%,91.4% 87%,87.9% 97%,81.2% 90%,
  77.4% 99%,70.1% 88%,64.8% 97%,59.9% 89%,53.1% 100%,47.6% 90%,41.2% 97%,
  36.7% 88%,29.4% 99%,24.1% 91%,18.2% 97%,12.6% 87%,6.4% 98%,2.1% 90%,0 96%); }
.eyebrow{ font-family:var(--ui); font-size:9px; font-weight:700; letter-spacing:.30em;
  text-transform:uppercase; color:var(--kraft); }
.citybox{ display:inline-block; margin-top:11px; border:1px solid currentColor;
  padding:5px 11px 4px; font-family:var(--ui); font-size:11px; font-weight:700;
  letter-spacing:.30em; text-transform:uppercase; color:var(--ink); }
.places{ width:372px; } .places .sheet{ padding:15px 18px 46px; }
.places .clock{ display:block; margin-top:9px; font-family:"Fraunces",Georgia,serif;
  font-variation-settings:"opsz" 120,"wght" 400,"WONK" 0; font-size:57px; line-height:.92;
  letter-spacing:-.03em; color:var(--ink); font-variant-numeric:tabular-nums; }
.places .rule{ height:1px; background:var(--edge); margin:14px 0 9px; }
.label{ position:absolute; z-index:28; background:linear-gradient(170deg,#ece2ca,#e2d6ba);
  padding:4px 9px 5px; border-radius:1px; font-family:var(--hand-face); font-size:13px;
  color:var(--hand-adam); white-space:nowrap;
  box-shadow:0 1px 1px rgba(0,0,0,.30), 0 5px 9px rgba(0,0,0,.34); }
.label.hers{ color:var(--hand-eva); }
.tape{ position:absolute; z-index:30; pointer-events:none; }
.tape img{ display:block; width:100%; height:auto; filter:drop-shadow(0 2px 2px rgba(0,0,0,.34)); }
.press{ position:absolute; pointer-events:none; }
.press img{ display:block; width:100%; height:auto;
  filter:drop-shadow(0 3px 4px rgba(0,0,0,.42)) drop-shadow(0 10px 16px rgba(0,0,0,.30)); }
.hand{ font-family:var(--hand-face); color:var(--hand-eva); font-size:15.5px; line-height:1.5; }
.hand.his{ color:var(--hand-adam); }

/* OPTION A only: the well is fixed portrait and the photograph is cropped
   into it. This is the ONLY rule in this file that is not design-H's. */
.crop img{ height:var(--wellh); object-fit:cover; }

/* OPTION D only: the plate — a landscape-native object. Same paper, same
   shadow, same rotation language; a different footprint. Nothing about a
   photograph is altered, only the shape of the thing it is mounted on. */
.plate{
  background:linear-gradient(168deg,#fdfaf2,#f7f1e3 62%,#f1e9d8),
             url("/materials/paper-coldpress-stock.webp") center/210% auto;
  background-blend-mode:multiply;
  padding:8px 8px 0; border-radius:2px; box-shadow:var(--lie);
}
.plate img{ display:block; width:100%; height:auto; background:#3a3129; }
.plate .chin{ display:block; font-family:var(--hand-face); font-size:13px;
  line-height:26px; height:26px; color:var(--hand-adam); text-align:right; padding-right:4px; }

/* ── the deck card, copied from design-H ──────────────────────── */
.deckstage{ position:absolute; inset:0; z-index:60; background:#150f0a; display:none;
  flex-direction:column; align-items:center; }
.deckstage::before{ content:""; position:absolute; inset:0; z-index:0;
  background:#150f0a var(--wood) center/cover no-repeat; opacity:.34; }
.deckstage[data-on]{ display:flex; }
.pcard{ position:relative; z-index:2; width:306px; height:462px; margin-top:14px; }
.cx{ position:relative; width:100%; height:100%; border-radius:2px;
  box-shadow:0 30px 58px rgba(0,0,0,.58), 0 7px 16px rgba(0,0,0,.42); }
.front{ position:absolute; inset:0; border-radius:2px; overflow:hidden;
  background:linear-gradient(168deg,#fdfaf2,#f7f1e3 64%,#f0e8d6),
             url("/materials/paper-coldpress-stock.webp") center/150% auto;
  background-blend-mode:multiply; padding:13px 13px 0; display:flex; flex-direction:column; }
.well{ position:relative; width:280px; height:344px; overflow:hidden; background:#241d15;
  box-shadow:0 1px 4px rgba(60,42,18,.34), 0 0 0 1px rgba(60,42,18,.13); }
.well img{ display:block; width:100%; height:100%; object-fit:cover; filter:none; }
/* landscape-native well: same 280 width, the height the photograph asks for */
.well.landwell{ height:210px; }
.chin2{ flex:1 1 auto; display:flex; flex-direction:column; justify-content:center; padding:0 3px; }
.chin2 .place{ font-family:"Fraunces",Georgia,serif;
  font-variation-settings:"opsz" 60,"wght" 440,"WONK" 1; font-size:26px; line-height:1;
  letter-spacing:-.016em; color:var(--ink); }
.chin2 .when{ margin-top:7px; font-family:var(--ui); font-size:9px; font-weight:600;
  letter-spacing:.26em; text-transform:uppercase; color:var(--kraft); }
.corner{ position:absolute; right:0; bottom:0; z-index:6; width:28px; height:28px;
  clip-path:polygon(100% 0,100% 100%,0 100%);
  background:linear-gradient(45deg,#d7c9a8,#e6dcc2 55%,#f2ead8);
  box-shadow:-2px -2px 3px rgba(60,42,18,.3); }

/* ── the book leaf, copied from design-H ──────────────────────── */
.bookstage{ position:absolute; inset:0; z-index:60; background:#150f0a; display:none;
  flex-direction:column; align-items:center; }
.bookstage::before{ content:""; position:absolute; inset:0; z-index:0;
  background:#150f0a var(--wood) center/cover no-repeat; opacity:.34; }
.bookstage[data-on]{ display:flex; }
.pleaf{ position:relative; z-index:2; width:330px; height:496px; margin-top:8px; }
.lf{ position:absolute; inset:0; overflow:hidden;
  background:linear-gradient(96deg,#efe7d4,#f6f0e2 22%,#f3ecdd);
  box-shadow:0 2px 6px rgba(0,0,0,.32), 0 14px 30px rgba(0,0,0,.34);
  padding:26px 24px 22px; }
.lf .kicker{ font-family:var(--ui); font-size:8.5px; font-weight:700; letter-spacing:.3em;
  text-transform:uppercase; color:var(--kraft); }
.lf h2{ margin-top:9px; font-family:"Fraunces",Georgia,serif;
  font-variation-settings:"opsz" 120,"wght" 400,"WONK" 1; font-size:40px; line-height:.94;
  letter-spacing:-.026em; color:var(--ink); font-weight:400; }
.lf .mount{ margin-top:16px; padding:8px 8px 0;
  background:linear-gradient(168deg,#fdfaf2,#f4eddd);
  box-shadow:0 1px 2px rgba(60,42,18,.3), 0 8px 16px rgba(60,42,18,.22); }
.lf .mount img{ display:block; width:100%; height:196px; object-fit:cover;
  background:#241d15; filter:none; }
.lf .mount.fit img{ height:auto; object-fit:fill; }
.lf .mount .cap{ display:block; font-family:var(--hand-face); font-size:14px;
  line-height:30px; height:30px; color:var(--hand-eva); text-align:center; }
.lf .say{ margin-top:16px; font-family:var(--hand-face); font-size:16.5px;
  line-height:1.52; color:var(--hand-eva); }

/* the caption strip that names which rule is on screen. It is chrome,
   it sits on the wood, never on a photograph. */
#tag{ position:fixed; z-index:200; left:0; right:0; top:0; text-align:center;
  font-family:var(--ui); font-size:9.5px; font-weight:700; letter-spacing:.2em;
  text-transform:uppercase; color:#f0e5cd; padding:9px 12px;
  background:#140d07; box-shadow:0 2px 10px rgba(0,0,0,.6); }
#tag b{ color:var(--amber); }
@media (min-width:520px){
  html,body{ background:#0d0906; } body{ display:grid; place-items:center; }
  #device{ width:393px; height:852px; max-height:100dvh; border-radius:38px;
    transform:translateZ(0); box-shadow:0 0 0 1px rgba(255,224,180,.10), 0 36px 90px rgba(0,0,0,.66); }
}
</style>
</head>
<body>

<div id="device">
  <p id="tag"></p>
  <div id="viewport"><div id="surface"><div id="world"></div></div></div>
  <div class="deckstage" id="deckstage"></div>
  <div class="bookstage" id="bookstage"></div>
</div>

<script>
(function(){
"use strict";

/* Real photographs, measured with sips — not guessed.
   L = 1000x750 (1.333). P = 750x1000 (0.750). N = narrow portrait. */
var L1 = { src:"/design-ph-20260724-09.jpg", w:1000, h:750 };
var L2 = { src:"/design-ph-20260731-01.jpg", w:1000, h:750 };
var L3 = { src:"/design-ph-20260727-01.jpg", w:1000, h:750 };
var L4 = { src:"/design-ph-20260802-01.jpg", w:1000, h:750 };
var P1 = { src:"/design-ph-20260806-01.jpg", w:750,  h:1000 };
var P2 = { src:"/design-ph-20260803-01.jpg", w:750,  h:1000 };
var N1 = { src:"/design-ph-20260806-04.jpg", w:460,  h:1000 };

var world = document.getElementById("world");
var q = new URLSearchParams(location.search);
var panel = q.get("p") || "a";

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

/* The day column exactly as design-H places it: the same left/top, the
   same widths, the same rotations. Only the photographs change. */
function header(){
  return '<div class="obj scrap places" style="left:50px;top:52px;transform:rotate(-0.9deg)">' +
    '<div class="sheet torn-b"><div class="eyebrow">Sunday 9 August</div>' +
    '<span class="citybox">New York</span><span class="clock">3:41 PM</span>' +
    '<div class="rule"></div></div></div>' +
    '<div class="tape" style="left:350px;top:38px;width:76px;transform:rotate(30deg)">' +
    '<img src="/materials/washi-terracotta.webp" alt=""></div>' +
    '<div class="press" style="left:326px;top:166px;width:76px;transform:rotate(22deg);z-index:4">' +
    '<img src="/materials/sticker-rose-red-pressed.webp" alt=""></div>';
}

/* ---- OPTION A: the frame stays portrait, the photograph is cropped ---- */
function optionA(){
  /* Every slot keeps the height the ORIGINAL portrait photograph gave it,
     and a landscape photograph is object-fit:cover'd into it. The 250px
     print was 328px tall with a portrait in it; it stays 328px tall. */
  var h = '';
  h += header();
  h += '<div class="obj print crop" style="left:60px;top:236px;width:250px;transform:rotate(-3.4deg);--wellh:328px">' +
       '<img src="'+L1.src+'" alt="Landscape photograph, 24 July"><span class="chin">24 July</span></div>';
  h += '<div class="tape" style="left:250px;top:242px;width:96px;transform:rotate(23deg)">' +
       '<img src="/materials/washi-ochre-dots.webp" alt=""></div>';
  h += '<div class="obj bare crop" style="left:282px;top:326px;width:158px;z-index:8;transform:rotate(5.6deg);--wellh:211px">' +
       '<img src="'+L2.src+'" alt="Landscape photograph, 31 July"></div>';
  h += '<div class="label hers" style="left:278px;top:552px;transform:rotate(4.4deg)">31 July</div>';
  h += '<div class="obj bare crop" style="left:44px;top:640px;width:140px;transform:rotate(-6.2deg);--wellh:187px">' +
       '<img src="'+L3.src+'" alt="Landscape photograph, 27 July"></div>';
  h += '<div class="label" style="left:40px;top:842px;transform:rotate(-5.2deg)">27 July</div>';
  h += '<div class="obj print crop" style="left:200px;top:690px;width:176px;transform:rotate(2.6deg);--wellh:231px">' +
       '<img src="'+P1.src+'" alt="Portrait photograph, 6 August"><span class="chin his">6 August</span></div>';
  return h;
}

/* ---- OPTION B: the object takes the photograph's own shape ---- */
function optionB(){
  /* Identical left/top and width to option A. height:auto is design-H's
     OWN rule for .print img and .bare img, so nothing here is invented —
     the object simply ends where the photograph ends. */
  var h = '';
  h += header();
  h += '<div class="obj print" style="left:60px;top:236px;width:250px;transform:rotate(-3.4deg)">' +
       '<img src="'+L1.src+'" alt="Landscape photograph, 24 July"><span class="chin">24 July</span></div>';
  h += '<div class="tape" style="left:250px;top:242px;width:96px;transform:rotate(23deg)">' +
       '<img src="/materials/washi-ochre-dots.webp" alt=""></div>';
  h += '<div class="obj bare" style="left:282px;top:326px;width:158px;z-index:8;transform:rotate(5.6deg)">' +
       '<img src="'+L2.src+'" alt="Landscape photograph, 31 July"></div>';
  h += '<div class="label hers" style="left:278px;top:552px;transform:rotate(4.4deg)">31 July</div>';
  h += '<div class="obj bare" style="left:44px;top:640px;width:140px;transform:rotate(-6.2deg)">' +
       '<img src="'+L3.src+'" alt="Landscape photograph, 27 July"></div>';
  h += '<div class="label" style="left:40px;top:842px;transform:rotate(-5.2deg)">27 July</div>';
  h += '<div class="obj print" style="left:200px;top:690px;width:176px;transform:rotate(2.6deg)">' +
       '<img src="'+P1.src+'" alt="Portrait photograph, 6 August"><span class="chin his">6 August</span></div>';
  return h;
}

/* ---- OPTION D: two object types, and the slot knows which it wants ---- */
function optionD(){
  /* The composition is authored as SLOTS, and a slot declares the shape it
     holds. A landscape photograph goes in a plate: wider, shorter, its
     caption along the foot instead of centred. A portrait goes in a print.
     Nothing is cropped and nothing leaves a hole, because the slot was
     drawn for the shape that lands in it. */
  var h = '';
  h += header();
  h += '<div class="obj plate" style="left:46px;top:236px;width:292px;transform:rotate(-2.2deg)">' +
       '<img src="'+L1.src+'" alt="Landscape photograph, 24 July"><span class="chin">24 July</span></div>';
  h += '<div class="tape" style="left:288px;top:222px;width:88px;transform:rotate(19deg)">' +
       '<img src="/materials/washi-ochre-dots.webp" alt=""></div>';
  h += '<div class="obj print" style="left:66px;top:470px;width:172px;transform:rotate(-4.4deg)">' +
       '<img src="'+P1.src+'" alt="Portrait photograph, 6 August"><span class="chin">6 August</span></div>';
  h += '<div class="obj plate" style="left:238px;top:512px;width:150px;z-index:12;transform:rotate(4.8deg)">' +
       '<img src="'+L2.src+'" alt="Landscape photograph, 31 July"><span class="chin">31 July</span></div>';
  h += '<div class="press" style="left:44px;top:690px;width:62px;transform:rotate(-22deg);z-index:28">' +
       '<img src="/materials/sticker-butterfly-pressed.webp" alt=""></div>';
  h += '<div class="obj plate" style="left:96px;top:748px;width:266px;transform:rotate(1.9deg)">' +
       '<img src="'+L3.src+'" alt="Landscape photograph, 27 July"><span class="chin">27 July</span></div>';
  h += '<div class="obj print" style="left:60px;top:990px;width:132px;transform:rotate(3.6deg)">' +
       '<img src="'+N1.src+'" alt="Narrow portrait photograph, 6 August"><span class="chin his">6 August</span></div>';
  h += '<div class="obj plate" style="left:214px;top:1010px;width:158px;transform:rotate(-3.1deg)">' +
       '<img src="'+L4.src+'" alt="Landscape photograph, 2 August"><span class="chin">2 August</span></div>';
  return h;
}

/* ---- the deck card ---- */
function deckPanel(which){
  var st = document.getElementById("deckstage");
  st.setAttribute("data-on","");
  var landNative = which === "fit";
  st.innerHTML =
    '<div class="pcard"><div class="cx"><div class="front">' +
      '<div class="well'+(landNative?" landwell":"")+'">' +
        '<img src="'+L1.src+'" alt="Landscape photograph, 24 July"></div>' +
      '<div class="chin2"><p class="place">24 July</p><p class="when">2026</p></div>' +
      '<span class="corner"></span>' +
    '</div></div></div>';
}

/* ---- the book leaf ---- */
function bookPanel(which){
  var st = document.getElementById("bookstage");
  st.setAttribute("data-on","");
  var fit = which === "fit";
  st.innerHTML =
    '<div class="pleaf"><div class="lf">' +
      '<p class="kicker">One</p><h2>The square</h2>' +
      '<div class="mount'+(fit?" fit":"")+'">' +
        '<img src="'+P2.src+'" alt="Portrait photograph, 3 August">' +
        '<span class="cap">3 August</span></div>' +
      '<p class="say">the whole square to myself for about a minute.</p>' +
    '</div></div>';
}

var TAGS = {
  a:    'Option A &middot; <b>the frame crops to portrait</b> &middot; 39% of each landscape frame discarded',
  b:    'Option B &middot; <b>the object takes the photograph’s shape</b> &middot; same slots, holes below',
  d:    'Option D &middot; <b>a second object type: the plate</b> &middot; slots authored per orientation',
  deck:     'The deck card today &middot; <b>landscape cropped into a 280&times;344 portrait well</b>',
  deckfit:  'The deck card &middot; <b>landscape-native well, 280&times;210</b>',
  book:     'The book leaf today &middot; <b>portrait cropped into a 266&times;196 landscape mount</b> &middot; 45% lost',
  bookfit:  'The book leaf &middot; <b>mount takes the photograph’s shape</b>'
};

if (panel === "a") world.innerHTML = optionA();
else if (panel === "b") world.innerHTML = optionB();
else if (panel === "d") world.innerHTML = optionD();
else if (panel === "deck") deckPanel("crop");
else if (panel === "deckfit") deckPanel("fit");
else if (panel === "book") bookPanel("crop");
else if (panel === "bookfit") bookPanel("fit");

document.getElementById("tag").innerHTML = TAGS[panel] || panel;

/* THE TRAP THIS PROJECT HAS ALREADY PAID FOR: a screen has been judged
   before with 401s where the photographs go. Nothing here is judged until
   every <img> reports a non-zero naturalWidth. __READY stays false and
   __BAD lists whatever failed, so the screenshot step can refuse. */
window.__BAD = [];
window.__READY = false;
window.addEventListener("load", function(){
  var imgs = [].slice.call(document.images);
  imgs.forEach(function(im){
    if (!im.complete || im.naturalWidth === 0) window.__BAD.push(im.getAttribute("src"));
  });
  window.__COUNT = imgs.length;
  window.__READY = true;
});
})();
</script>
</body>
</html>
